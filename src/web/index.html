<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Cam</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span id="dot" class="live-dot"></span>
        <h1>Agent Cam</h1>
      </div>
      <div class="scope">
        <span id="updated" class="updated">connecting…</span>
        <span id="scope-title" class="scope-title"></span>
        <span id="scope-counts" class="scope-counts"></span>
      </div>
    </header>

    <main id="grid" class="grid loading">
      <section class="panel now wide">
        <div class="now-grid">
          <div class="now-item">
            <div class="label">Editing</div>
            <div id="file" class="value mono">—</div>
            <div id="file-diff" class="sub"></div>
          </div>
          <div class="now-item">
            <div class="label">Running</div>
            <div id="command" class="value mono">—</div>
          </div>
          <div class="now-item">
            <div class="label">Signal</div>
            <div class="signal">
              <span id="signal-dot" class="status-dot"></span>
              <span id="signal-state" class="value">—</span>
            </div>
            <div id="signal-reason" class="sub"></div>
            <div id="signal-caption" class="caption"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="label">Tokens for this task</div>
        <div id="tokens" class="metric">—</div>
        <div id="tokens-sub" class="sub"></div>
        <div class="caption">summed over the main session and every subagent it spawned</div>
      </section>

      <section class="panel">
        <div class="label">Sessions</div>
        <div id="agents-count" class="metric">—</div>
        <ul id="agents" class="agents"></ul>
        <div class="caption">the main session, then the subagents it spawned</div>
      </section>

      <section class="panel wide">
        <div class="label">Plan · the agent's own words</div>
        <div id="plan" class="value muted">no plan</div>
      </section>

      <section class="panel wide">
        <div class="label">Feed</div>
        <ul id="feed" class="feed"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
